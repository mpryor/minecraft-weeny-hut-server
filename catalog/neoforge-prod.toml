description = "A simple Minecraft -> Discord Chat Link bot with Whitelisting"
category = ["social", "utility"]
side = "server"
reason = "Added 2026-08-28. Bidirectional Minecraft <-> Discord chat relay. Replaces dcintegration, which the prod pack uses but which has no 1.21.1 build (it skips straight from 1.21 to 1.21.3). The bot token arrives as an ECS secret and is interpolated into config/simple-discord-link/simple-discord-link.toml, which the generic pack ships -- the pack cannot carry the token itself, see NEOFORGE-MIGRATION.md. That config is checked in whole and generated by scripts/gen-sdlink-config.sh; a partial one cannot load, and one pinned below sdlink's configVersion truncates itself to zero bytes on the migration path."

