# Mod catalog — dev
#
# Why this file exists: packwiz rewrites mods/*.pw.toml from a Go struct on
# `packwiz update`, silently discarding comments and unknown keys, so a mod's
# rationale cannot live inline. This catalog is kept outside the pack directory
# so packwiz never sees it, and CI enforces that it stays 1:1 with the pack.
#
# One [<slug>] table per modpack/dev/mods/<slug>.pw.toml.
#   description - what the mod does (from Modrinth)
#   category    - Modrinth categories
#   side        - mirrors the pack's `side` field
#   reason      - why WE added it. TODO means nobody has written it down yet.
#
# Regenerate nothing automatically: edit reasons by hand, they are the point.

