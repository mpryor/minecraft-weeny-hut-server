name: Publish modpack

on:
  push:
    branches: [master]
    paths: ['modpack/**', 'catalog/**']
  pull_request:
    paths: ['modpack/**', 'catalog/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # index.toml stores a hash of every mod file, and pack.toml stores a hash of
  # the index. Hand-editing a .pw.toml without running `packwiz refresh` makes
  # clients and the server silently install the stale version, with no error.
  # Fail the build rather than publish a pack in that state.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Check refresh is a no-op
        run: |
          for env in dev prod neoforge; do
            (cd "modpack/$env" && packwiz refresh)
          done
          if ! git diff --exit-code -- modpack/; then
            echo "::error::'packwiz refresh' produced changes. Run it locally and commit the result."
            exit 1
          fi
          echo "All three packs are consistent."

      # A mod's rationale can't live in its .pw.toml — `packwiz update` rewrites
      # those files from a Go struct and drops comments and unknown keys. The
      # catalog holds it instead, and this keeps the two from drifting apart.
      - name: Check catalog matches the packs
        run: |
          if ! python3 scripts/check-catalog.py; then
            echo "::error::catalog/ is out of sync with modpack/. See the errors above."
            exit 1
          fi

      # The real build runs in the deploy job, which is skipped on pull requests
      # -- so without this a broken build script would only surface at publish
      # time, after review. Also revalidates every client mod's hash against its
      # .pw.toml, and fails if the generic pack's content base stops resolving to
      # the zip root (see scripts/build-client-extras.py).
      - name: Build client-extras pack
        run: |
          python3 scripts/build-client-extras.py neoforge -o /tmp/extras.zip
          python3 - <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile("/tmp/extras.zip").namelist()
          if "config/.generic-pack-anchor" not in names:
              sys.exit("::error::anchor missing; base would resolve below the zip root")
          stray = [n for n in names
                   if not n.startswith(("config/", "automodpack/host-modpack/main/"))]
          if stray:
              sys.exit(f"::error::entries outside the host-modpack tree: {stray}")
          print(f"ok: {len(names)} entries, anchor present")
          EOF

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Client-only mods never reach /data/mods (the image runs
      # packwiz-installer -s server), and AutoModpack only serves /data/mods, so
      # players relying on AutoModpack would get none of them. This zip carries
      # them, plus shaderpacks, into automodpack/host-modpack/main via the
      # container's GENERIC_PACKS handling. Built here rather than committed so
      # it can never drift from the pack it is derived from.
      - name: Build client-extras generic pack
        run: |
          python3 scripts/build-client-extras.py neoforge
          unzip -l modpack/neoforge-client-extras.zip

      # modpack/ becomes the site root, so the packs resolve at
      #   <pages-url>/dev/pack.toml  and  <pages-url>/prod/pack.toml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: modpack
      - id: deployment
        uses: actions/deploy-pages@v4
